[project]
name = "locallibrary"
version = "0.1.0"
description = "Linux desktop research app: local library, RAG reading view, saved research shelves."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "ollama>=0.4",
    "google-genai>=1.0",
    "pymupdf>=1.25",
    "trafilatura>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["locallibrary*"]

[tool.setuptools.package-data]
"locallibrary.ui" = ["*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
