services:
  db:
    image: pgvector/pgvector:pg17
    container_name: locallibrary-db
    environment:
      POSTGRES_USER: locallibrary
      POSTGRES_PASSWORD: locallibrary
      POSTGRES_DB: locallibrary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
